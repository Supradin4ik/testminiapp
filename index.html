<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Production Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ============ DESIGN SYSTEM ============ */
  :root {
    --bg:        var(--tg-theme-bg-color, #0e1116);
    --bg-2:      var(--tg-theme-secondary-bg-color, #161b22);
    --card:      #1a2029;
    --card-2:    #212a35;
    --border:    #2a3441;
    --text:      var(--tg-theme-text-color, #e6edf3);
    --text-2:    #8b949e;
    --text-3:    #5d6673;
    --accent:    var(--tg-theme-button-color, #2f81f7);
    --accent-tx: var(--tg-theme-button-text-color, #fff);

    --ok:    #2ea043;
    --warn:  #d29922;
    --dang:  #f85149;
    --info:  #58a6ff;
    --neutral:#6e7681;

    --r-s: 6px;
    --r-m: 10px;
    --r-l: 14px;

    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 20px;
    --sp-6: 24px;

    --tap: 44px;
    --nav-h: 60px;
    --header-h: 52px;

    --f-xs: 11px;
    --f-s:  13px;
    --f-m:  15px;
    --f-l:  18px;
    --f-xl: 22px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: var(--f-m);
    line-height: 1.4;
    overscroll-behavior-y: none;
  }
  body { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }

  /* ============ APP SHELL ============ */
  #app { min-height: 100vh; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }

  .header {
    position: sticky; top: 0; z-index: 20;
    height: var(--header-h);
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 0 var(--sp-4);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .header__title { font-size: var(--f-l); font-weight: 600; flex: 1; }
  .header__back {
    width: 32px; height: 32px; display: grid; place-items: center;
    border-radius: var(--r-s); margin-left: -8px;
  }
  .header__back:active { background: var(--card); }

  .context-bar {
    display: flex; align-items: center; gap: var(--sp-2);
    margin: var(--sp-2) var(--sp-4) 0;
    padding: var(--sp-2) var(--sp-3);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-m);
    font-size: var(--f-s);
    color: var(--text-2);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .context-bar b { color: var(--text); font-weight: 600; }

  .content { flex: 1; padding: var(--sp-4); padding-bottom: var(--sp-6); }

  /* ============ BOTTOM NAV ============ */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 30;
  }
  .nav__item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    font-size: var(--f-xs);
    color: var(--text-3);
    min-height: var(--tap);
    transition: color .12s;
  }
  .nav__item.active { color: var(--accent); }
  .nav__item svg { width: 22px; height: 22px; }

  /* ============ CARDS ============ */
  .section { margin-bottom: var(--sp-5); }
  .section__head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: var(--sp-3);
  }
  .section__title { font-size: var(--f-s); font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .section__action { font-size: var(--f-s); color: var(--accent); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-m);
    padding: var(--sp-3);
  }
  .card + .card { margin-top: var(--sp-2); }

  .row {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-3);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-m);
    min-height: var(--tap);
  }
  .row + .row { margin-top: var(--sp-2); }
  .row:active { background: var(--card-2); }
  .row__main { flex: 1; min-width: 0; }
  .row__title { font-weight: 600; font-size: var(--f-m); }
  .row__sub { font-size: var(--f-s); color: var(--text-2); margin-top: 2px; }
  .row__chev { color: var(--text-3); flex-shrink: 0; }

  /* ============ STATUS ============ */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: var(--f-xs); font-weight: 600;
    padding: 2px 8px;
    border-radius: 100px;
    background: var(--card-2);
    color: var(--text-2);
  }
  .badge--ok      { background: rgba(46,160,67,.15);  color: var(--ok); }
  .badge--warn    { background: rgba(210,153,34,.15); color: var(--warn); }
  .badge--dang    { background: rgba(248,81,73,.15);  color: var(--dang); }
  .badge--info    { background: rgba(88,166,255,.15); color: var(--info); }

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot--ok   { background: var(--ok); }
  .dot--warn { background: var(--warn); }
  .dot--dang { background: var(--dang); }
  .dot--info { background: var(--info); }

  /* ============ PROGRESS ============ */
  .progress {
    height: 4px; background: var(--card-2);
    border-radius: 100px; overflow: hidden;
  }
  .progress__fill { height: 100%; background: var(--accent); border-radius: 100px; transition: width .3s; }

  /* ============ GRID ============ */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }

  /* ============ ATTENTION CARD ============ */
  .attention {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-3);
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--neutral);
    border-radius: var(--r-m);
  }
  .attention + .attention { margin-top: var(--sp-2); }
  .attention--dang { border-left-color: var(--dang); }
  .attention--warn { border-left-color: var(--warn); }
  .attention--info { border-left-color: var(--info); }
  .attention--ok   { border-left-color: var(--ok); }
  .attention__main { flex: 1; min-width: 0; }
  .attention__title { font-weight: 600; font-size: var(--f-s); }
  .attention__sub { font-size: var(--f-s); color: var(--text-2); margin-top: 2px; }

  /* ============ QUICK ACTIONS ============ */
  .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
  .quick {
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2);
    padding: var(--sp-3);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-m);
    min-height: 88px;
    text-align: left;
  }
  .quick:active { background: var(--card-2); }
  .quick__icon { font-size: 20px; }
  .quick__label { font-size: var(--f-s); font-weight: 500; }

  /* ============ STOCK CARD ============ */
  .stock {
    padding: var(--sp-3);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-m);
  }
  .stock + .stock { margin-top: var(--sp-2); }
  .stock__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); }
  .stock__brand { font-size: var(--f-l); font-weight: 700; letter-spacing: -0.01em; }
  .stock__dim { font-size: var(--f-s); color: var(--text-2); }
  .stock__meta { font-size: var(--f-s); color: var(--text-2); margin-top: 2px; }
  .stock__stats {
    display: flex; gap: var(--sp-4); margin-top: var(--sp-3);
    padding-top: var(--sp-3); border-top: 1px solid var(--border);
  }
  .stat__val { font-size: var(--f-m); font-weight: 600; }
  .stat__lbl { font-size: var(--f-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }

  /* ============ BUTTONS ============ */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
    min-height: var(--tap);
    padding: 0 var(--sp-4);
    border-radius: var(--r-m);
    font-weight: 600;
    font-size: var(--f-m);
    transition: opacity .1s;
  }
  .btn:active { opacity: .7; }
  .btn--primary { background: var(--accent); color: var(--accent-tx); }
  .btn--ghost   { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn--dang    { background: var(--dang); color: #fff; }
  .btn--block   { width: 100%; }
  .btn-row { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); }
  .btn-row .btn { flex: 1; }

  /* ============ MODAL / SHEET ============ */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.5);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 720px;
    background: var(--bg-2);
    border-radius: var(--r-l) var(--r-l) 0 0;
    padding: var(--sp-4);
    padding-bottom: calc(var(--sp-4) + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .2s ease-out;
  }
  .overlay.open .sheet { transform: translateY(0); }
  .sheet__handle {
    width: 36px; height: 4px; border-radius: 100px;
    background: var(--border); margin: 0 auto var(--sp-4);
  }
  .sheet__title { font-size: var(--f-l); font-weight: 600; margin-bottom: var(--sp-4); }

  /* ============ CONFIRM ============ */
  .confirm-row {
    display: flex; justify-content: space-between; gap: var(--sp-3);
    padding: var(--sp-2) 0;
    border-bottom: 1px solid var(--border);
    font-size: var(--f-s);
  }
  .confirm-row:last-of-type { border-bottom: none; }
  .confirm-row__label { color: var(--text-2); }
  .confirm-row__value { font-weight: 600; text-align: right; }
  .confirm-delta {
    margin-top: var(--sp-3);
    padding: var(--sp-3);
    background: var(--card);
    border-radius: var(--r-m);
    font-size: var(--f-s);
    color: var(--text-2);
  }
  .confirm-delta b { color: var(--text); }

  .danger-note {
    padding: var(--sp-3);
    background: rgba(248,81,73,.08);
    border: 1px solid rgba(248,81,73,.3);
    border-radius: var(--r-m);
    color: var(--dang);
    font-size: var(--f-s);
    margin-bottom: var(--sp-3);
  }

  /* ============ CHAT ============ */
  .chat { display: flex; flex-direction: column; gap: var(--sp-3); }
  .msg { max-width: 85%; padding: var(--sp-3); border-radius: var(--r-m); font-size: var(--f-s); }
  .msg--user { align-self: flex-end; background: var(--accent); color: var(--accent-tx); border-bottom-right-radius: 4px; }
  .msg--ai   { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg__actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); flex-wrap: wrap; }
  .msg__actions .btn { min-height: 36px; padding: 0 var(--sp-3); font-size: var(--f-s); }
  .chat-input {
    display: flex; gap: var(--sp-2);
    padding: var(--sp-2);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-m);
    margin-top: var(--sp-3);
  }
  .chat-input input { flex: 1; background: none; border: none; outline: none; padding: var(--sp-2); }
  .chat-input button { padding: 0 var(--sp-4); background: var(--accent); color: var(--accent-tx); border-radius: var(--r-s); font-weight: 600; }

  /* ============ EMPTY ============ */
  .empty {
    text-align: center; padding: var(--sp-6) var(--sp-4);
    color: var(--text-2); font-size: var(--f-s);
  }
  .empty__icon { font-size: 32px; margin-bottom: var(--sp-3); opacity: .5; }

  /* ============ SKELETON ============ */
  .skel {
    background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%);
    background-size: 200% 100%;
    animation: skel 1.2s infinite;
    border-radius: var(--r-s);
  }
  @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ============ FAB ============ */
  .fab {
    position: fixed;
    right: var(--sp-4);
    bottom: calc(var(--nav-h) + var(--sp-4) + env(safe-area-inset-bottom));
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-tx);
    display: grid; place-items: center;
    font-size: 22px;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    z-index: 25;
  }
  .fab:active { transform: scale(.95); }

  /* ============ UTIL ============ */
  .muted { color: var(--text-2); }
  .tiny  { font-size: var(--f-xs); color: var(--text-3); }
  .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .flex  { display: flex; align-items: center; gap: var(--sp-2); }
  .between { justify-content: space-between; }
  .mt-3 { margin-top: var(--sp-3); }
  .mt-4 { margin-top: var(--sp-4); }
</style>
</head>

<div id="fab"></div>

  return { ...base, tgName: u ? `${u.first_name} ${u.last_name || ''}`.trim() : base.name };

function renderHeader(title, { back = false } = {}) {
  return `<div class="header">
    ${back ? `<button class="header__back" data-action="back">${ICONS.back}</button>` : ''}
    <div class="header__title">${esc(title)}</div>
  </div>`;
}

function renderContextBar() {
  const { order, project } = state.context;
  if (!order && !project) return '';
  const parts = [];
  if (order) parts.push(`📋 Наряд <b>#${order.id}</b>`);
  if (order?.project || project) parts.push(`<b>${esc(order?.project || project)}</b>`);
  return `<div class="context-bar" data-action="context-open">${parts.join(' › ')}</div>`;
}

function renderNav() {
  const items = NAV_BY_ROLE[currentUser.role] || NAV_BY_ROLE.laser;
  return items.map(it => `
    <button class="nav__item ${state.tab === it.id ? 'active' : ''}" data-action="tab:${it.id}">
      ${ICONS[it.icon]}
      <span>${it.label}</span>

  `).join('');
}

function renderFab() {
  const canAI = ['owner','chief'].includes(currentUser.role);

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const c = $('#content');
  const headerEl = $('#header');
  const contextEl = $('#context');

  // Экраны, которые сами рендерят header+context
  let html = '';
  const t = state.tab;
  const top = state.stack[state.stack.length - 1];

  if (top) {
    if (top.name === 'order') html = screenOrder(top.id);
    else if (top.name === 'pending') html = screenPending();
    else if (top.name === 'ai') html = screenAI();
    else html = screenHome();
    headerEl.innerHTML = '';
    contextEl.innerHTML = '';
    c.innerHTML = html;
  } else {
    if (t === 'home') html = screenHome();
    else if (t === 'warehouse') html = screenWarehouse();
    else if (t === 'orders') html = screenOrders();
    else if (t === 'more') html = screenMore();
    else html = screenHome();
    headerEl.innerHTML = '';
    contextEl.innerHTML = '';
    c.innerHTML = html;
  }

  $('#nav').innerHTML = renderNav();
  $('#nav').style.display = state.stack.length ? 'none' : 'flex';
  $('#fab').innerHTML = state.stack.length ? '' : renderFab();
}

/* ============================================================
   NAVIGATION ACTIONS
   ============================================================ */
function push(screen) { state.stack.push(screen); render(); }
function pop() { state.stack.pop(); render(); }
function setTab(id) { state.tab = id; state.stack = []; render(); }

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  haptic.tap();

  if (action.startsWith('tab:')) { setTab(action.slice(4)); return; }
  if (action === 'back') { pop(); return; }
  if (action === 'sheet:close') { closeSheet(); return; }

  if (action === 'pending') { push({ name: 'pending' }); return; }
  if (action === 'ai') { push({ name: 'ai' }); return; }

  if (action.startsWith('nav:')) {
    const dest = action.slice(4);
    if (['home','work','warehouse','orders','more'].includes(dest)) setTab(dest);
    else if (dest === 'pending') push({ name: 'pending' });
    else if (dest === 'projects') setTab('more'); // demo
    return;
  }

  if (action.startsWith('order:')) {
    const id = action.split(':')[1];
    if (id === 'open') return;
    push({ name: 'order', id });
    return;
  }

  if (action.startsWith('context:set:')) {
    const id = +action.split(':')[2];
    const o = MOCK_ORDERS.find(x => x.id === id);
    state.context.order = { id: o.id, project: o.project, done: o.done, total: o.total };
    haptic.success();
    pop();
    return;
  }

  if (action === 'op:outgoing') { showConfirmOutgoing(); return; }
  if (action === 'confirm:outgoing' || action === 'confirm:outgoing:final') {
    // BACKEND GAP: POST /api/pending/{id}/confirm
    state.pending = state.pending.filter(p => p.id !== 'p1');
    closeSheet();
    haptic.success();
    render();
    return;
  }
  if (action === 'confirm:cancel') { haptic.warn(); return; }

  if (action.startsWith('pending:confirm:')) {
    const id = action.split(':')[2];
    state.pending = state.pending.filter(p => p.id !== id);
    haptic.success();
    render();
    return;
  }
  if (action.startsWith('pending:cancel:')) {
    const id = action.split(':')[2];
    state.pending = state.pending.filter(p => p.id !== id);
    haptic.warn();
    render();
    return;
  }

  if (action.startsWith('demo-role:')) {
    const role = action.split(':')[1];
    localStorage.setItem('demo_role', role);
    currentUser = { ...MOCK_USERS[role], tgName: currentUser.tgName };
    state.stack = [];
    state.tab = 'home';
    render();
    haptic.success();
    return;
  }

  // Заглушки для нереализованных экранов
  const stubs = ['mes','people','timesheet','notes','rules','journal','gaps','users','paint','checks','incoming','outgoing','scrap','move','inventory'];
  const plain = action.replace(/^op:/, '');
  if (stubs.includes(plain) || stubs.includes(action)) {
    openSheet(`
      <div class="sheet__title">${esc(plain || action)}</div>
      <div class="muted">Экран в разработке. Логика и данные — из backend.</div>
      <div class="btn-row"><button class="btn btn--primary btn--block" data-action="sheet:close">Понятно</button></div>
    `);
    return;
  }
});

document.addEventListener('submit', (e) => e.preventDefault());
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-action="ai:send"]')) {
    const input = document.querySelector('[data-role="chat-input"]');
    if (!input || !input.value.trim()) return;
    const chat = $('#chat');
    chat.appendChild(h('').appendChild ? h(`<div class="msg msg--user">${esc(input.value)}</div>`) : null);
    input.value = '';
  }
});

/* ============================================================
   BOOT
   ============================================================ */
render();
</script>
</body>
</html>
